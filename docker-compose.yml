services:
  mongodb:
    image: mongo:8.0
    container_name: comparae-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - comparae_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' --host localhost | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [comparae]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    container_name: comparae-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    volumes:
      - comparae_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [comparae]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comparae-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/scraping_lojas
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOG_FILE: /app/.dados/logs/aplicacao.log
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - comparae_backend_data:/app/.dados
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/saude').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [comparae]

networks:
  comparae:
    name: comparae

volumes:
  comparae_mongodb_data:
  comparae_elasticsearch_data:
  comparae_backend_data:
